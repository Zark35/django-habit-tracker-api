services:
  - type: web
    name: habit-tracker-api
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    instanceType: starter
    plan: free
    startCommand: ./entrypoint.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: habit_tracker.settings.production
      - key: SECRET_KEY
        fromSecret: SECRET_KEY
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: REDIS_URL
        fromSecret: REDIS_URL
      - key: ALLOWED_HOSTS
        value: example.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://example.onrender.com
      - key: PYTHONUNBUFFERED
        value: '1'
